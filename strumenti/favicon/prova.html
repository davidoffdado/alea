<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Prova favicon</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 32px; background: #fff; color: #111; }
  h2 { font-size: 15px; margin: 32px 0 12px; font-weight: 600; }
  .righe { display: grid; grid-template-columns: 180px 1fr; gap: 14px 24px; align-items: center; }
  .nome { font-size: 13px; color: #555; }
  .misure { display: flex; align-items: flex-end; gap: 24px; }
  .misure figure { margin: 0; text-align: center; font-size: 11px; color: #777; }
  .misure img { display: block; margin: 0 auto 4px; }
  .barra { display: flex; gap: 2px; padding: 8px 8px 0; border-radius: 8px 8px 0 0; width: 560px; }
  .barra.chiara { background: #dee1e6; }
  .barra.scura { background: #202124; }
  .scheda { display: flex; align-items: center; gap: 8px; padding: 8px 12px; font-size: 12px; border-radius: 8px 8px 0 0; width: 170px; }
  .chiara .scheda { color: #333; } .chiara .scheda.attiva { background: #fff; }
  .scura .scheda { color: #ddd; } .scura .scheda.attiva { background: #35363a; }
  .scheda img { width: 16px; height: 16px; }
  .google { display: flex; align-items: center; gap: 12px; font-family: Arial, sans-serif; }
  .google .tondo { width: 28px; height: 28px; border-radius: 50%; background: #f1f3f4; display: grid; place-items: center; }
  .google .tondo img { width: 18px; height: 18px; }
  .google .sito { font-size: 14px; color: #202124; line-height: 1.2; }
  .google .url { font-size: 12px; color: #4d5156; }
  .google .titolo { font-size: 20px; color: #1a0dab; margin-top: 6px; }
</style>
</head>
<body>
<h1 style="font-size:18px">Favicon di àlea: attuale e nuove proposte</h1>

<h2>Dimensioni reali</h2>
<div class="righe" id="misure"></div>

<h2>Nelle schede del browser (16 px)</h2>
<div id="schede"></div>

<h2>Nei risultati di Google</h2>
<div class="righe" id="google"></div>

<script>
const V = [
  ["attuale (cerchio nero)", "favicon-attuale.svg"],
  ["lime, angoli arrotondati", "favicon-lime.svg"],
  ["lime, quadrato pieno", "favicon-lime-quadrato.svg"],
  ["lime, tondo", "favicon-lime-tondo.svg"],
];
const m = document.getElementById("misure"), s = document.getElementById("schede"), g = document.getElementById("google");
for (const [nome, f] of V) {
  m.insertAdjacentHTML("beforeend", `<div class="nome">${nome}</div><div class="misure">${[16, 32, 48, 180].map(px => `<figure><img src="${f}" width="${px}" height="${px}" alt="">${px} px</figure>`).join("")}</div>`);
  g.insertAdjacentHTML("beforeend", `<div class="nome">${nome}</div><div class="google"><div class="tondo"><img src="${f}" alt=""></div><div><div class="sito">Àlea</div><div class="url">https://alea.news</div></div></div>`);
}
for (const tema of ["chiara", "scura"]) {
  s.insertAdjacentHTML("beforeend", `<div class="barra ${tema}" style="margin-bottom:14px; width:740px">${V.map(([nome, f], i) => `<div class="scheda ${i === 1 ? "attiva" : ""}"><img src="${f}" alt="">Àlea - Raccontare…</div>`).join("")}</div>`);
}
</script>
</body>
</html>
