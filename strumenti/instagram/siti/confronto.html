<!doctype html>
<!-- Bozze dei SITI (articoli) ricolorati con i temi dello stile 3: per ogni tema due "telefoni" con pezzi dell'articolo.
     Le schermate sono quelle di ../caroselli/ritagli/<tema>/ (sh ritagli/scatta.sh). ?a=litigi|moneta
     PNG con: sh genera.sh -->
<html lang="it"><head><meta charset="utf-8"><title>àlea · temi degli articoli</title>
<style>
  body { margin: 0; padding: 30px; background: #777; color: #fff; font: 16px "IBM Plex Mono", monospace; width: 2040px; }
  h2 { font: 600 15px "IBM Plex Mono", monospace; margin: 0 0 8px; }
  .griglia { display: grid; grid-template-columns: repeat(2, 1fr); gap: 34px 28px; }
  .tel { display: flex; gap: 10px; }
  .tel div { width: 300px; height: 585px; background-repeat: no-repeat; background-size: 384px auto; border-radius: 4px; }
</style></head><body><div class="griglia" id="g"></div><script>
const a = new URLSearchParams(location.search).get("a") || "litigi";
// pezzi da mostrare: file e altezza da cui partire (px CSS del telefono; il "telefono" mostra 390×760, scalato)
const PEZZI = { litigi: [["litigi-0.png", 760], ["litigi-scena6.png", 0], ["litigi-12660.png", 0]], moneta: [["moneta.png", 100], ["moneta-gioco.png", 100], ["moneta.png", 3000]] }[a];
const temi = ["nero-lime", "nero-bianco", "bianco-lime", "bianco-nero"];
document.getElementById("g").innerHTML = temi.map((t) => `<div><h2>${t.replace("-", " + ")}</h2><div class="tel">${PEZZI.map(([f, y]) =>
  `<div style="background-image:url(../caroselli/ritagli/${t}/${f});background-position:0 ${-y * 384 / 500}px"></div>`).join("")}</div></div>`).join("");
</script></body></html>
