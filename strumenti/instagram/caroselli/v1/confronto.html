<!doctype html>
<!-- Foglio di confronto: le 6 slide di un articolo nelle tre varianti, una riga per variante. ?a=litigi | moneta -->
<html lang="it"><head><meta charset="utf-8"><title>àlea · confronto caroselli</title>
<style>
  body { margin: 0; padding: 30px; background: #1b1b1b; color: #eee; font: 18px "IBM Plex Mono", monospace; }
  .riga { display: flex; gap: 14px; align-items: center; margin-bottom: 22px; }
  .riga b { width: 110px; flex: none; }
  img { width: 280px; height: 350px; display: block; }
</style></head><body><script>
const a = new URLSearchParams(location.search).get("a") || "litigi";
const nomi = { A: "A collage", B: "B rivista", C: "C schermo" };
for (const v of "ABC") document.write(`<div class="riga"><b>${nomi[v]}</b>${[1,2,3,4,5,6].map((s) => `<img src="png/${a}-${v}-${s}.png">`).join("")}</div>`);
</script></body></html>
