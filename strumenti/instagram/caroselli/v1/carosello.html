<!doctype html>
<!--
  CAROSELLI DI ÀLEA, BOZZE (Instagram, 1080×1350): fondo lime, ritagli dell'articolo e foto.
  Uso: carosello.html?a=litigi&v=A&s=1
    a = articolo (litigi, moneta)   v = variante (A collage, B rivista, C schermo)   s = numero della slide
  PNG con: sh genera.sh   (scrive png/<articolo>-<variante>-<slide>.png)
  I testi e i ritagli sono nell'oggetto ARTICOLI; le tre varianti usano gli stessi contenuti, cambia solo l'impaginazione.
-->
<html lang="it">
<head>
<meta charset="utf-8">
<title>àlea · caroselli</title>
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@500,600&display=block" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Courier+Prime:wght@400;700&display=block" rel="stylesheet">
<style>
  :root { --lime: #d4ff3a; --nero: #000; --carta: #fbfbf7; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { background: var(--lime); color: var(--nero); font-family: "General Sans", sans-serif; }
  .s { position: relative; width: 1080px; height: 1350px; padding: 72px; overflow: hidden; }

  /* testata uguale in tutte le varianti: àlea a sinistra, numero e slide a destra */
  .testa { position: relative; z-index: 5; display: flex; justify-content: space-between; font: 26px "IBM Plex Mono", monospace; letter-spacing: .04em; }

  /* RITAGLIO: un pezzo della schermata dell'articolo visto da telefono, con bordo nero e ombra piena (come le copertine del sito) */
  /* nella variante B la testata può finire sopra la foto: le scritte su un'etichetta lime */
  .v-B .testa span { background: var(--lime); padding: 4px 10px; }
  .ritaglio { position: absolute; background-repeat: no-repeat; background-color: #fff; border: 3px solid #000; box-shadow: 16px 16px 0 #000; }
  /* FOTO: in bianco e nero e "stampata" sul lime (multiply = i bianchi diventano lime, i neri restano neri) */
  .foto { position: absolute; background-size: cover; background-position: center top; filter: grayscale(1) contrast(1.25) brightness(1.05); mix-blend-mode: multiply; }
  .foto.ritagliata { border: 3px solid #000; mix-blend-mode: normal; }
  .didascalia { position: absolute; font: 18px/1.35 "IBM Plex Mono", monospace; }
  .credito { position: absolute; left: 72px; bottom: 34px; font: 15px "IBM Plex Mono", monospace; opacity: .7; z-index: 6; }
  .kicker { font: 500 24px "IBM Plex Mono", monospace; letter-spacing: .06em; text-transform: uppercase; }
  .testo { font-weight: 600; letter-spacing: -.035em; line-height: 1.02; }
  .testo b, .cit b { background: #000; color: var(--lime); font-weight: inherit; padding: 0 .12em; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .cit { font-family: "Fraunces", serif; font-weight: 500; letter-spacing: -.02em; line-height: 1.12; }
  .moneta .cit { font-family: "Courier Prime", monospace; font-weight: 700; letter-spacing: 0; }
  /* striscia di carta con l'annotazione stenografica, come un ritaglio di giornale incollato */
  .striscia { position: absolute; background: #fff; border: 3px solid #000; padding: 14px 22px; font: 500 24px/1.3 "IBM Plex Mono", monospace; z-index: 4; }
  .cta { font-weight: 600; font-size: 104px; line-height: .95; letter-spacing: -.05em; }
  .link { font: 500 30px "IBM Plex Mono", monospace; background: #000; color: var(--lime); padding: 10px 18px; display: inline-block; }
</style>
</head>
<body>
<div class="s" id="s"></div>
<script>
// ---------------------------------------------------------------------------------------------
// RITAGLI: pezzi di schermata dell'articolo. src = file in ../ritagli/, larg = larghezza del telefono in quella
// schermata (px CSS), x/y/w/h = il rettangolo da ritagliare, in px CSS del telefono.
// ---------------------------------------------------------------------------------------------
const R = {
  l_intro:    { src: "litigi-lungo.png", larg: 390, x: 0, y: 655, w: 390, h: 335 },
  l_frasca:   { src: "litigi-5064.png",  larg: 500, x: 0, y: 230, w: 500, h: 300 },
  l_emi94:    { src: "litigi-9284.png",  larg: 500, x: 0, y: 0,   w: 500, h: 235 },
  l_bossi:    { src: "litigi-7596.png",  larg: 500, x: 0, y: 425, w: 500, h: 180 },
  l_ce:       { src: "litigi-9284.png",  larg: 500, x: 0, y: 262, w: 500, h: 455 },
  l_draghi:   { src: "litigi-12660.png", larg: 500, x: 0, y: 0,   w: 500, h: 520 },
  m_gioco:    { src: "moneta-gioco.png", larg: 390, x: 0, y: 100, w: 390, h: 510 },
  m_rand:     { src: "moneta-lungo.png", larg: 390, x: 0, y: 1150, w: 390, h: 150 },
  m_serie:    { src: "moneta-lungo.png", larg: 390, x: 0, y: 3375, w: 390, h: 240 },
  m_cambi:    { src: "moneta-lungo.png", larg: 390, x: 0, y: 3825, w: 390, h: 245 },
  m_tabella:  { src: "moneta-lungo.png", larg: 390, x: 0, y: 2765, w: 390, h: 285 },
};

// ---------------------------------------------------------------------------------------------
// CONTENUTI. Ogni slide: kicker, testo (con <b> = evidenziato), cit (citazione), annot (annotazione stenografica),
// rit (ritaglio), foto (lista di immagini in ../foto/), cred (crediti foto). tipo: "copertina" | "cta" | normale.
// ---------------------------------------------------------------------------------------------
const ARTICOLI = {
  litigi: {
    n: 1, url: "alea.news/litigi-tra-alleati",
    slide: [
      { tipo: "copertina", testo: "Nella politica italiana si litiga anche tra alleati",
        foto: ["umberto_bossi.jpg", "silvio_berlusconi.jpg"], rit: "l_bossi",
        cred: "Foto: Parlamento europeo; La Moncloa (Wikimedia Commons)" },
      { kicker: "Camera dei deputati, 1948-2022",
        testo: "<b>1.047 volte</b> un partito di maggioranza ha protestato mentre parlava un alleato",
        rit: "l_intro", foto: [] },
      { kicker: "21 dicembre 1994 · governo Berlusconi I", cit: "«La Lega, onorevole Presidente, <b>le toglie la fiducia!</b>»",
        annot: "(Vivissime, reiterate proteste dei deputati dei gruppi di Forza Italia, di Alleanza nazionale-MSI e del Centro cristiano democratico)",
        testo: "Il giorno dopo Berlusconi si dimette.", foto: ["umberto_bossi.jpg"], rit: "l_emi94",
        cred: "Foto: Umberto Bossi, Parlamento europeo (Wikimedia Commons)" },
      { kicker: "10 luglio 2003 · governo Berlusconi II", cit: "«Siamo stanchi di sentire la Lega»",
        annot: "(Una voce dai banchi del gruppo di Forza Italia: «È vero!»)",
        testo: "Alessandro Cè, Lega: «Allora <b>alzati e dillo</b>»", foto: ["alessandro_cè.jpg"], rit: "l_ce",
        cred: "Foto: Alessandro Cè, Camera dei deputati, CC BY-SA 4.0" },
      { kicker: "2021-2022 · governo Draghi",
        testo: "Il governo con più litigi dopo De Gasperi: <b>98 in venti mesi</b>, 57 tra PD e Lega",
        cit: "«Basta!»", annot: "(Dai banchi del gruppo Lega-Salvini Premier, 24 marzo 2021)",
        foto: ["mario_draghi.jpg", "matteo_salvini.jpg"], rit: "l_draghi",
        cred: "Foto: Parlamento europeo, CC BY 2.0; Unione europea" },
      { tipo: "cta", testo: "Tutti i 1.047 litigi, da cercare per nome, partito e anno", rit: "l_frasca", foto: [] },
    ],
  },
  moneta: {
    n: 2, url: "alea.news/prova-a-fare-il-caso",
    slide: [
      { tipo: "copertina", testo: "Non siamo bravi a simulare il caso",
        foto: ["eniac-operatrici.jpg"], rit: "m_rand", cred: "Foto: ENIAC, esercito USA, pubblico dominio" },
      { kicker: "Il gioco", testo: "Scrivi cento lanci di moneta <b>inventati</b>, il più possibile simili a quelli veri", rit: "m_gioco", foto: [] },
      { kicker: "Il caso fa serie lunghe", testo: "In cento lanci veri la serie più lunga è quasi sempre di <b>5 o più</b>: sei teste di fila non sono «troppe»",
        rit: "m_serie", nota: "Dall'articolo: la serie più lunga in 20.000 sequenze vere. In rosso, chi gioca", foto: [] },
      { kicker: "Chi inventa cambia troppo", testo: "Una moneta passa da testa a croce <b>circa 50 volte</b> su 100. Chi la imita tende ad alternare di più",
        rit: "m_cambi", nota: "Dall'articolo: i cambi in 20.000 sequenze vere. In rosso, chi gioca", foto: [] },
      { kicker: "1955", cit: "A Million Random Digits with 100,000 Normal Deviates",
        testo: "Per avere numeri davvero casuali la RAND <b>stampò un libro</b> di cifre a caso",
        foto: ["ibm-nasa.jpg"], rit: "m_rand", cred: "Foto: IBM 704 alla NASA, pubblico dominio" },
      { tipo: "cta", testo: "Inventa cento lanci: un programma proverà a prevederli", rit: "m_tabella", foto: [] },
    ],
  },
};

// ---------------------------------------------------------------------------------------------
// utilità di disegno
// ---------------------------------------------------------------------------------------------
// un ritaglio largo `larg` px nella slide, in posizione (sx, sy), ruotato di `rot` gradi
function ritaglio(nome, sx, sy, larg, rot = 0, extra = "") {
  const r = R[nome], k = larg / r.w;   // k = quanto ingrandire la schermata
  return `<div class="ritaglio" style="left:${sx}px;top:${sy}px;width:${larg}px;height:${Math.round(r.h * k)}px;
    background-image:url(../ritagli/${r.src});background-size:${r.larg * k}px auto;background-position:${-r.x * k}px ${-r.y * k}px;
    transform:rotate(${rot}deg);${extra}"></div>`;
}
// la larghezza più grande con cui il ritaglio sta in un riquadro maxW × maxH
const adatta = (nome, maxW, maxH) => Math.min(maxW, maxH * R[nome].w / R[nome].h);
const foto = (f, x, y, w, h, cls = "", extra = "") =>
  `<div class="foto ${cls}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;background-image:url('../foto/${f}');${extra}"></div>`;
const at = (x, y, w, html, extra = "") => `<div style="position:absolute;left:${x}px;top:${y}px;width:${w}px;${extra}">${html}</div>`;

// ---------------------------------------------------------------------------------------------
// LE TRE VARIANTI: ogni funzione riceve la slide e restituisce l'HTML del corpo
// ---------------------------------------------------------------------------------------------
const V = {
  // A · COLLAGE: ritagli storti, foto scontornate stampate sul lime, strisce di carta
  A(d) {
    if (d.tipo === "copertina") return `
      ${d.foto[1] ? foto(d.foto[1], 560, 560, 460, 640) : ""}
      ${foto(d.foto[0], d.foto[1] ? 120 : 60, d.foto[1] ? 600 : 560, d.foto[1] ? 460 : 960, d.foto[1] ? 690 : 640)}
      ${at(72, 170, 936, `<div class="testo" style="font-size:118px">${d.testo}</div>`)}
      ${ritaglio(d.rit, 470, 1010, 540, -3)}`;
    if (d.tipo === "cta") return `
      ${ritaglio(d.rit, 300, 640, 640, 3)}
      ${at(72, 180, 936, `<div class="cta">${d.testo}</div>`)}
      ${at(72, 1150, 900, `<span class="link">${A.url}</span>`, "z-index:5")}`;
    const f = d.foto[0] ? foto(d.foto[0], 640, 140, 400, 540) : "";
    const f2 = d.foto[1] ? foto(d.foto[1], 380, 120, 300, 420) : "";
    const testo = d.cit
      ? `<div class="kicker">${d.kicker}</div><div class="cit" style="font-size:76px;margin-top:28px">${d.cit}</div>`
      : `<div class="kicker">${d.kicker}</div><div class="testo" style="font-size:80px;margin-top:28px">${d.testo}</div>`;
    return `${f2}${f}
      ${at(72, 170, d.foto[0] ? 550 : 936, testo, "z-index:3")}
      ${ritaglio(d.rit, d.foto[0] ? 72 : 120, d.foto[0] ? 760 : 660, adatta(d.rit, d.foto[0] ? 620 : 840, d.foto[0] ? 480 : 560), -2)}
      ${d.annot ? `<div class="striscia" style="left:520px;top:${d.cit ? 650 : 1060}px;width:500px;transform:rotate(2.5deg)">${d.annot}</div>` : ""}
      ${d.cit && d.testo ? at(720, 1080, 300, `<div class="testo" style="font-size:40px">${d.testo}</div>`) : ""}`;
  },

  // B · RIVISTA: foto grande a tutta larghezza in alto, testo serif sotto, ritaglio piccolo come "box"
  B(d) {
    const alto = 660;
    const img = d.foto.length
      ? (d.foto.length > 1 ? foto(d.foto[0], 0, 0, 540, alto) + foto(d.foto[1], 540, 0, 540, alto) : foto(d.foto[0], 0, 0, 1080, alto))
      : ritaglioPieno(d.rit, alto);
    if (d.tipo === "copertina") return `${img}
      <div style="position:absolute;left:0;top:${alto}px;width:1080px;border-top:3px solid #000"></div>
      ${at(72, alto + 50, 936, `<div class="testo" style="font-size:112px">${d.testo}</div>`)}`;
    if (d.tipo === "cta") return `${img}
      ${at(72, alto + 60, 936, `<div class="cta" style="font-size:88px">${d.testo}</div><div style="margin-top:44px"><span class="link">${A.url}</span></div>`)}`;
    const corpo = d.cit
      ? `<div class="cit" style="font-size:66px">${d.cit}</div>${d.annot ? `<div class="didascalia" style="position:static;margin-top:22px;font-size:21px">${d.annot}</div>` : ""}`
      : `<div class="testo" style="font-size:72px">${d.testo}</div>`;
    return `${img}
      ${at(72, alto + 36, 936, `<div class="kicker" style="margin-bottom:22px">${d.kicker}</div>${corpo}`)}
      ${d.foto.length ? ritaglio(d.rit, 600, alto - 300, 410, 0, "box-shadow:12px 12px 0 #000") : ""}`;
  },

  // C · SCHERMO: frase informativa grande in alto, il ritaglio dell'articolo protagonista sotto
  C(d) {
    if (d.tipo === "copertina") return `
      ${at(72, 170, 936, `<div class="testo" style="font-size:118px">${d.testo}</div>`)}
      ${foto(d.foto[0], 72, 760, 300, 420, "ritagliata")}
      ${ritaglio(d.rit, 420, 800, 590, 0)}`;
    if (d.tipo === "cta") return `
      ${at(72, 170, 936, `<div class="cta" style="font-size:96px">${d.testo}</div>`)}
      ${ritaglio(d.rit, 140, 690, 800, 0)}
      ${at(72, 1210, 900, `<span class="link">${A.url}</span>`, "z-index:5")}`;
    const titolo = d.cit
      ? `<div class="cit" style="font-size:60px">${d.cit}</div>`
      : `<div class="testo" style="font-size:62px">${d.testo}</div>`;
    const larg = adatta(d.rit, 880, 660);
    return `
      ${at(72, 160, 936, `<div class="kicker" style="margin-bottom:22px">${d.kicker}</div>${titolo}`)}
      ${ritaglio(d.rit, (1080 - larg) / 2 - 8, 560, larg, 0)}
      ${d.foto[0] ? foto(d.foto[0], 820, 470, 200, 260, "ritagliata", "z-index:4") : ""}`;
  },
};
// il ritaglio usato come immagine di testata, quando la slide non ha foto (variante B)
function ritaglioPieno(nome, alto) {
  const r = R[nome], k = 1080 / r.w;
  return `<div style="position:absolute;left:0;top:0;width:1080px;height:${alto}px;background:#fff url(../ritagli/${r.src}) no-repeat;
    background-size:${r.larg * k}px auto;background-position:0 ${-r.y * k + Math.min(0, (alto - r.h * k) / 2)}px;border-bottom:3px solid #000"></div>`;
}

const q = new URLSearchParams(location.search);
const A = ARTICOLI[q.get("a") || "litigi"], v = q.get("v") || "A", i = (+q.get("s") || 1) - 1, d = A.slide[i];
document.body.classList.add(q.get("a") || "litigi");
Promise.all(['600 100px "General Sans"', '26px "IBM Plex Mono"', '500 60px Fraunces', '700 60px "Courier Prime"'].map((f) => document.fonts.load(f))).then(() => {
  document.getElementById("s").innerHTML =
    `<div class="testa"><span>àlea</span><span>n. ${String(A.n).padStart(2, "0")} · ${i + 1}/${A.slide.length}</span></div>` +
    V[v](d) + (d.cred ? `<div class="credito">${d.cred}</div>` : "") +
    (d.nota ? `<div class="credito" style="bottom:${d.cred ? 60 : 34}px">${d.nota}</div>` : "");
document.body.classList.add("v-" + v);
});
</script>
</body>
</html>
