<!doctype html>
<!--
  CAROSELLI DI ÀLEA, BOZZE v3 (Instagram, 1080×1350): variante "blocchi" con i temi dello stile 3.
  Fondo della slide = fondo dell'articolo (nero, grigio, bianco); dietro ogni riga dei ritagli una banda
  dell'evidenziatore (lime, bianco, grigio, nero). Testo scritto solo nella copertina e l'indirizzo nell'ultima slide.
  Uso: carosello.html?a=litigi&tema=nero-lime&s=1
  I ritagli si fotografano con node ritagli/scatta.mjs (elenco in ritagli/elenco.js, una cartella per tema).
  PNG con: sh genera.sh   (scrive png/<articolo>-<tema>-<slide>.png e i fogli di confronto)
  Versioni precedenti: v1/ (collage, rivista, schermo), v2/ (stampa, blocchi, manifesto sul lime).
-->
<html lang="it">
<head>
<meta charset="utf-8">
<title>àlea · caroselli v3</title>
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@600&display=block" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=block" rel="stylesheet">
<script src="../temi.js"></script>
<script src="../ritagli/elenco.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  /* i colori arrivano dal tema (variabili impostate dallo script) */
  body { background: var(--fondo); color: var(--testo); font-family: "General Sans", sans-serif; }
  .s { position: relative; width: 1080px; height: 1350px; overflow: hidden; }
  .testa { position: absolute; left: 64px; right: 64px; top: 46px; z-index: 5; display: flex; justify-content: space-between; font: 26px "IBM Plex Mono", monospace; letter-spacing: .04em; }
  .filo { position: absolute; background: var(--testo); }
  .foto { position: absolute; background-size: cover; background-position: center 25%; filter: grayscale(1) contrast(1.3); }

  /* RITAGLIO: la schermata dell'articolo ricolorato, così com'è (il suo fondo è uguale a quello della slide).
     Sopra ogni riga di testo una BANDA dell'evidenziatore con dentro una copia del ritaglio fusa con il colore della banda:
     - .scuro (evidenziatore chiaro): la copia diventa testo scuro su bianco e va in multiply sul colore della banda;
     - .chiaro (evidenziatore nero): la copia diventa testo chiaro su nero e va in screen.
     .inv = l'immagine va prima invertita (hue-rotate riporta i colori dei grafici quasi agli originali) */
  .rit, .copia { position: absolute; background-repeat: no-repeat; }
  .banda { position: absolute; background: var(--ev); overflow: hidden; isolation: isolate; }
  .copia.scuro { mix-blend-mode: multiply; filter: contrast(1.3) brightness(1.08); }
  .copia.scuro.inv { filter: invert(1) hue-rotate(180deg) contrast(1.3) brightness(1.08); }
  .copia.chiaro { mix-blend-mode: screen; filter: contrast(1.3); }
  .copia.chiaro.inv { filter: invert(1) hue-rotate(180deg) contrast(1.3); }

  .gancio { position: absolute; left: 64px; right: 64px; font-weight: 600; font-size: 104px; line-height: 1.08; letter-spacing: -.045em; }
  .gancio span { background: var(--ev); color: var(--su); padding: 0 .12em; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .link { position: absolute; font: 500 30px "IBM Plex Mono", monospace; background: var(--ev); color: var(--su); padding: 10px 18px; z-index: 6; }
  .credito { position: absolute; left: 64px; bottom: 26px; font: 15px "IBM Plex Mono", monospace; z-index: 6; color: var(--testo2); }
</style>
</head>
<body>
<div class="s" id="s"></div>
<script>
// ---------------------------------------------------------------------------------------------
// ---------------------------------------------------------------------------------------------
// ogni ritaglio è un file a sé (ritagli/<tema>/<nome>.png, fatto da ritagli/scatta.mjs secondo ritagli/elenco.js):
// la finestra è 390×1000 px CSS e il pezzo parte in alto; altezza e righe da tenere si misurano leggendo i pixel
const R = {};
for (const [nome, e] of Object.entries(ELENCO)) R[nome] = { src: nome + ".png", larg: 500, x: 0, w: 390, y: 0, h: 1000, righe: e.righe || [0, 999] };

// ---------------------------------------------------------------------------------------------
// CONTENUTI: ogni slide è solo foto + ritagli. gancio = testo della copertina, url = indirizzo nell'ultima.
// ---------------------------------------------------------------------------------------------
const ARTICOLI = {
  litigi: { n: 1, url: "alea.news/litigi-tra-alleati", slide: [
    { gancio: "Nella politica italiana si litiga anche tra alleati", foto: ["umberto_bossi.jpg", "silvio_berlusconi.jpg"],
      cred: "Foto: Parlamento europeo; La Moncloa (Wikimedia Commons)" },
    { rit: ["l_titolo", "l_1047"] },
    { foto: ["umberto_bossi.jpg"], rit: ["l_bossi_tit", "l_bossi_frase", "l_bossi_dopo"], cred: "Foto: Umberto Bossi, Parlamento europeo (Wikimedia Commons)" },
    { rit: ["l_ce_tit", "l_ce_dialogo"] },
    { foto: ["mario_draghi.jpg", "matteo_salvini.jpg"], rit: ["l_draghi_testo"], cred: "Foto: Parlamento europeo, CC BY 2.0; Unione europea" },
    { rit: ["l_draghi_emi", "l_draghi_tl"], url: true },
  ] },
  moneta: { n: 2, url: "alea.news/simulazione-casualita", slide: [
    { gancio: "Non siamo bravi a simulare il caso", foto: ["eniac-operatrici.jpg"], cred: "Foto: ENIAC, esercito USA, pubblico dominio" },
    { rit: ["m_gioco"] },
    { foto: ["ibm-nasa.jpg"], rit: ["m_rand"], cred: "Foto: IBM 704 alla NASA, pubblico dominio" },
    { rit: ["m_serie_t", "m_serie_g"] },
    { rit: ["m_cambi_t", "m_cambi_g"] },
    { rit: ["m_oracolo_t", "m_oracolo_g"], url: true },
  ] },
};

// ---------------------------------------------------------------------------------------------
// tema
// ---------------------------------------------------------------------------------------------
const q = new URLSearchParams(location.search);
const [fondo, evNome] = (q.get("tema") || "nero-lime").split("-");
const F = FONDI[fondo], E = evid(fondo, evNome);
const root = document.documentElement.style;
root.setProperty("--fondo", F.fondo); root.setProperty("--testo", F.testo); root.setProperty("--testo2", F.testo2);
root.setProperty("--ev", E.ev); root.setProperty("--su", E.su);
// come fondere i ritagli: testo scuro se l'evidenziatore è chiaro, chiaro se è nero; si inverte quando la pagina è al contrario
const tono = E.su === "#000" ? "scuro" : "chiaro";
const inverti = (tono === "scuro") === (fondo === "nero");
const cartella = `../ritagli/${fondo}-${evNome}/`;

// ---------------------------------------------------------------------------------------------
// disegno (variante "blocchi": fili spessi, foto vere a filo dei bordi, ritagli nelle celle)
// ---------------------------------------------------------------------------------------------
function rit(nome, k, y, margine = 64) {
  const r = R[nome], h = r.h * k;
  return { html: `<div class="rit" data-nome="${nome}" data-k="${k}" style="left:${margine - 16 * k}px;top:${y}px;
    width:${r.w * k}px;height:${h}px;background-image:url(${cartella}${r.src});background-size:${r.larg * k}px auto;
    background-position:${-r.x * k}px ${-r.y * k}px"></div>`, h };
}
const foto = (f, x, y, w, h) => `<div class="foto" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;background-image:url('../foto/${f}')"></div>`;
const filo = (x, y, w, h) => `<div class="filo" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"></div>`;

function slide(d) {
  const T = 8;                                     // spessore dei fili
  let h = filo(0, 110, 1080, T), y = 110 + T;
  const fotoRiga = (y0, alto) => {
    const n = d.foto.length;
    d.foto.forEach((f, i) => {
      h += fotoArg(i * 1080 / n + (i ? T / 2 : 0), y0, 1080 / n - (n > 1 ? T / 2 : 0), alto, f);
      if (i) h += filo(1080 / n - T / 2, y0, T, alto);
    });
  };
  if (d.gancio) {
    fotoRiga(700 + T, 650 - T); h += filo(0, 700, 1080, T);
    return h + `<div class="gancio" style="top:170px"><span>${d.gancio}</span></div>`;
  }
  if (d.foto) { fotoRiga(y, 400); y += 400; h += filo(0, y, 1080, T); y += T; }
  // i ritagli uno sotto l'altro, separati da un filo, alla scala più grande che entra nello spazio
  const gap = 36, spazio = 1350 - y - (d.url ? 150 : 80) - 2 * 40 - (d.rit.length - 1) * (2 * gap + T);
  const k = Math.min(952 / (390 - 32), spazio / d.rit.reduce((t, n) => t + R[n].h, 0));
  y += 40;
  d.rit.forEach((n, i) => {
    if (i) { y += gap; h += filo(0, y, 1080, T); y += T + gap; }
    const r = rit(n, k, y); h += r.html; y += r.h;
  });
  if (d.url) h += filo(0, 1350 - 116, 1080, T) + `<div class="link" style="left:64px;bottom:30px">${A.url}</div>`;
  return h;
}
// la funzione foto vuole (x, y, w, h, file): la riga delle foto la chiama così
function fotoArg(x, y, w, h, f) { return foto(f, x, y, w, h); }

// ---------------------------------------------------------------------------------------------
// LETTURA DELLE RIGHE: carica la schermata e trova le righe con inchiostro (ciò che si stacca dal fondo
// della pagina) dentro il rettangolo del ritaglio. Restituisce le bande in px dell'immagine e f = px per px CSS.
// ---------------------------------------------------------------------------------------------
const bg = parseInt(F.fondo.slice(1), 16), lumFondo = .3 * (bg >> 16) + .59 * ((bg >> 8) & 255) + .11 * (bg & 255);
const immagini = {};
const carica = (src) => immagini[src] ||= new Promise((ok) => { const img = new Image(); img.onload = () => ok(img); img.onerror = () => ok(null); img.src = cartella + src; });
async function leggiRighe(r) {
  const img = await carica(r.src);
  if (!img) return { f: 2, bande: [] };
  const f = img.naturalWidth / r.larg, W = Math.round(r.w * f), H = Math.round(r.h * f);
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const g = c.getContext("2d"); g.drawImage(img, -r.x * f, -r.y * f);
  const px = g.getImageData(0, 0, W, H).data, righe = [];
  for (let y = 0; y < H; y++) {
    let min = W, max = -1;
    for (let x = 0; x < W; x++) {
      const p = (y * W + x) * 4, a = px[p], b = px[p + 1], cc = px[p + 2];
      const lum = .3 * a + .59 * b + .11 * cc, sat = Math.max(a, b, cc) - Math.min(a, b, cc);
      if (Math.abs(lum - lumFondo) > 70 || sat > 90) { if (x < min) min = x; max = x; }
    }
    righe.push(max >= 0 ? [min, max] : null);
  }
  // righe vicine (meno di 3px CSS di vuoto) = la stessa riga di testo o lo stesso grafico
  const bande = []; let cur = null, vuote = 0;
  righe.forEach((rg, y) => {
    if (rg) {
      if (cur && vuote <= 3 * f) { cur.y1 = y; cur.x0 = Math.min(cur.x0, rg[0]); cur.x1 = Math.max(cur.x1, rg[1]); }
      else { cur = { y0: y, y1: y, x0: rg[0], x1: rg[1] }; bande.push(cur); }
      vuote = 0;
    } else vuote++;
  });
  return { f, bande: bande.filter((b) => b.y1 - b.y0 > 2 * f) };
}

// I ritagli con `righe: [prima, ultima]` hanno y/h come finestra di ricerca: la pagina può spostarsi di qualche
// pixel da una schermata all'altra, quindi si tengono le righe contate (da 0) invece di un'altezza fissa
async function aggiustaRitagli(nomi) {
  for (const n of nomi) {
    const r = R[n];
    if (!r.righe || r.fatto) continue;
    const { f, bande } = await leggiRighe(r), a = bande[r.righe[0]], b = bande[Math.min(r.righe[1], bande.length - 1)];
    if (a && b) { r.y += a.y0 / f - 8; r.h = (b.y1 - a.y0) / f + 16; }
    r.fatto = true;
  }
}

// EVIDENZIATORE: una banda su ciascuna riga di testo (alta meno di 50px CSS: grafici e fumetti restano come
// nell'articolo). La banda contiene una copia del ritaglio fusa con il suo colore, spostata per combaciare con quello sotto
async function evidenzia() {
  for (const el of document.querySelectorAll(".rit")) {
    const r = R[el.dataset.nome], k = +el.dataset.k, { f, bande } = await leggiRighe(r);
    const L = parseFloat(el.style.left), T = parseFloat(el.style.top), padX = 12, padY = 7;
    el.insertAdjacentHTML("afterend", bande.filter((b) => b.y1 - b.y0 < 50 * f).map((b) => {
      const bl = L + b.x0 / f * k - padX, bt = T + b.y0 / f * k - padY;
      return `<div class="banda" style="left:${bl}px;top:${bt}px;width:${(b.x1 - b.x0) / f * k + 2 * padX}px;height:${(b.y1 - b.y0) / f * k + 2 * padY}px">
        <div class="copia ${tono} ${inverti ? "inv" : ""}" style="left:${L - bl}px;top:${T - bt}px;width:${el.style.width};height:${el.style.height};
        background-image:${el.style.backgroundImage.replace(/"/g, "'")};background-size:${el.style.backgroundSize};background-position:${el.style.backgroundPosition}"></div></div>`;
    }).join(""));
  }
}

const A = ARTICOLI[q.get("a") || "litigi"], i = (+q.get("s") || 1) - 1, d = A.slide[i];
Promise.all(['600 100px "General Sans"', '26px "IBM Plex Mono"'].map((f) => document.fonts.load(f)))
  .then(() => aggiustaRitagli(d.rit || []))
  .then(() => {
    document.getElementById("s").innerHTML =
      `<div class="testa"><span>àlea</span><span>n. ${String(A.n).padStart(2, "0")} · ${i + 1}/${A.slide.length}</span></div>` +
      slide(d) + (d.cred ? `<div class="credito">${d.cred}</div>` : "");
    return evidenzia();
  });
</script>
</body>
</html>
