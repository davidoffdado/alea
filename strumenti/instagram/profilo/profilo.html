<!doctype html>
<!--
  FOTO PROFILO DI ÀLEA SU INSTAGRAM (1080×1080, Instagram la ritaglia a cerchio).
  ?v=lime  fondo lime, «à» nera (come la presentazione e le copertine)
  ?v=nero  fondo nero, «à» lime
  PNG con: sh genera.sh
-->
<html lang="it">
<head>
<meta charset="utf-8">
<title>àlea · foto profilo</title>
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@700&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; }
  body { font-family: "General Sans", sans-serif; display: flex; align-items: center; justify-content: center; }
  /* la «à» deve stare dentro il cerchio: alta circa due terzi del lato.
     translate: la spaziatura stretta del logo la sposta a destra, e l'accento la fa sembrare più in basso del centro */
  span { font-weight: 700; font-size: 760px; letter-spacing: -.075em; line-height: .8; transform: translate(-20px, -40px); }
</style>
</head>
<body>
<span>à</span>
<script>
const v = new URLSearchParams(location.search).get("v") || "lime";
const [fondo, lettera] = v === "nero" ? ["#000", "#d4ff3a"] : ["#d4ff3a", "#000"];
document.body.style.background = fondo;
document.querySelector("span").style.color = lettera;
</script>
</body>
</html>
