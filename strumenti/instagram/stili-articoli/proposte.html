<!doctype html>
<!--
  PROPOSTE DI STILE PER GLI ARTICOLI DI ÀLEA (bozze, non è il sito).
  Tre righe = tre strade; ogni riquadro è l'apertura di un articolo vista da telefono (390px).
  PNG con: sh genera.sh
-->
<html lang="it">
<head>
<meta charset="utf-8">
<title>àlea · stili degli articoli</title>
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&display=block" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Courier+Prime:wght@400;700&family=Noto+Sans:wght@400;600&display=block" rel="stylesheet">
<style>
  :root { --lime: #d4ff3a; }
  * { box-sizing: border-box; margin: 0; }
  body { background: #2a2a2a; color: #eee; font-family: "General Sans", sans-serif; padding: 40px; width: 1440px; }
  h2 { font-size: 34px; font-weight: 600; letter-spacing: -.02em; }
  .riga { display: grid; grid-template-columns: 300px repeat(3, 390px); gap: 28px; margin-bottom: 56px; align-items: start; }
  .spiega p { font-size: 17px; line-height: 1.45; color: #cfcfcf; margin-top: 12px; }
  .spiega .pro { color: var(--lime); }
  .etichetta { font: 13px "IBM Plex Mono", monospace; color: #aaa; margin-bottom: 8px; }

  /* il "telefono" */
  .tel { width: 390px; height: 760px; overflow: hidden; position: relative; border-radius: 6px; }
  .bar { height: 46px; background: #000; color: #fff; display: flex; align-items: center; justify-content: center; font: 600 24px "General Sans"; letter-spacing: -.03em; }
  .in { padding: 26px 18px; }
  .kick { font: 500 11px "IBM Plex Mono", monospace; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 14px; }
  .tit { margin-bottom: 14px; text-wrap: balance; }
  .by { font: 11px "IBM Plex Mono", monospace; opacity: .65; margin-bottom: 20px; }
  .p { font-size: 14px; line-height: 1.65; margin-bottom: 16px; }
  svg { display: block; margin: 6px 0 4px; }
  .leg { font: 10px "IBM Plex Mono", monospace; opacity: .7; }

  /* --- com'è ora: ogni articolo il suo mondo --- */
  .litigi-ora { background: #f9f9f7; color: #111; font-family: "Noto Sans", sans-serif; }
  .litigi-ora .tit { font: 700 36px/1.05 "Fraunces", serif; letter-spacing: -.02em; }
  .litigi-ora .tit u { text-decoration-color: #eb6834; text-decoration-thickness: 3px; text-underline-offset: 5px; }
  .litigi-ora mark { background: #ffe066; }
  .moneta-ora { background: #f3efe3; color: #1f1d19; font-family: "Courier Prime", monospace; }
  .moneta-ora .tit { font: 700 32px/1.05 "Courier Prime"; text-transform: uppercase; }
  .moneta-ora .p { font-size: 13px; }
  .moneta-ora mark { background: none; color: #b3352a; font-weight: 700; }

  /* --- cornice comune: apertura lime uguale per tutti, poi il mondo dell'articolo --- */
  .cornice { position: absolute; inset: 46px 0 auto 0; background: var(--lime); color: #000; padding: 22px 18px 24px; border-bottom: 3px solid #000; }
  .cornice .tit { font: 600 34px/1.0 "General Sans"; letter-spacing: -.045em; }
  .cornice .tit { text-transform: none; }
  .cornice .som { font-family: "General Sans", sans-serif; font-size: 15px; line-height: 1.4; margin-bottom: 14px; }
  .cornice .by { font-family: "IBM Plex Mono", monospace; }
  .dopo-cornice { margin-top: 286px; }

  /* --- sistema: tre fondi (nero, grigio, bianco), lime unico accento, General Sans per titoli --- */
  .sis .tit { font: 600 38px/1.0 "General Sans"; letter-spacing: -.045em; }
  .sis .p { font-family: "Noto Sans", sans-serif; }
  .nero { background: #0d0d0d; color: #f2f2f2; }
  .nero mark { background: none; color: var(--lime); font-weight: 600; }
  .grigio { background: #e9e9e6; color: #111; }
  .bianco { background: #fff; color: #111; }
  .grigio mark, .bianco mark { background: var(--lime); color: #000; padding: 0 2px; }
  .nero .bar, .grigio .bar, .bianco .bar { background: #000; }
  .bianco .bar { border-bottom: 3px solid var(--lime); }
  .foto { height: 150px; background-size: cover; background-position: center 20%; filter: grayscale(1) contrast(1.15); margin: 4px 0 12px; }
</style>
</head>
<body>
<div id="tutto"></div>
<script>
// piccoli grafici finti, solo per vedere i colori: barre (istogramma) ed emiciclo a pallini
function istogramma(c, hi, larg = 354, alto = 120) {
  const h = [1, 3, 8, 16, 27, 38, 45, 47, 42, 33, 22, 13, 7, 3, 1];
  const w = larg / h.length;
  return `<svg width="${larg}" height="${alto}">${h.map((v, i) => `<rect x="${i * w + 1}" y="${alto - v * 2.4}" width="${w - 2}" height="${v * 2.4}" fill="${i === 9 ? hi : c}"/>`).join("")}</svg>`;
}
function emiciclo(base, hi, chiaro, larg = 354) {
  let s = "", r0 = 70, n = 0;
  for (let anello = 0; anello < 7; anello++) {
    const r = r0 + anello * 13, k = Math.round(Math.PI * r / 12);
    for (let j = 0; j <= k; j++) {
      const a = Math.PI - (j / k) * Math.PI, x = larg / 2 + r * Math.cos(a), y = 160 - r * Math.sin(a);
      const t = j / k, col = t < .35 ? chiaro : t < .62 ? hi : base;
      s += `<circle cx="${x}" cy="${y}" r="4.6" fill="${col}"/>`; n++;
    }
  }
  return `<svg width="${larg}" height="166">${s}</svg>`;
}
const TL = { kick: "àlea · n. 01 · politica", tit: "I <u>litigi</u> tra gli <u>alleati</u> di governo", tit2: "I litigi tra gli alleati di governo",
  som: "Governano insieme, ma in aula si contestano: 1.047 volte dal 1948 al 2022.",
  p: "Ripercorrere la storia della Camera dei Deputati, dal 1948 al 2022, ci mostra <mark>1.047 eventi</mark> in cui un partito della maggioranza ha protestato, rumoreggiato o interrotto un proprio alleato." };
const TM = { kick: "àlea · n. 02 · probabilità", tit: "Non siamo bravi a simulare la casualità", tit2: "Non siamo bravi a simulare la casualità",
  som: "Inventa cento lanci di moneta: un programma proverà a prevederli.",
  p: "Su cento lanci veri, la serie più lunga è quasi sempre di <mark>5 lanci o più</mark>. Chi inventa una sequenza tende a evitarle." };
const TS = { kick: "àlea · n. 03 · cultura", tit2: "Il caso vero non sembra casuale",
  som: "Perché Spotify ha dovuto rendere il suo shuffle meno casuale.",
  p: "Tre canzoni dello stesso artista di fila sembrano un errore. Con una playlist di 200 brani succede <mark>più spesso di quanto pensi</mark>." };

const by = (d) => `<div class="by">di David Ruffini · ${d}</div>`;
const tel = (cls, html) => `<div class="tel ${cls}"><div class="bar">àlea</div>${html}</div>`;

const righe = [
  { titolo: "1 · Com'è ora", testo: `<p>Ogni articolo ha un mondo suo (carta RAND per la moneta, Fraunces e arancione per i litigi). In comune solo la barra nera e il fondo pagina.</p>
      <p class="pro">+ ogni pezzo è un oggetto unico, come The Pudding</p><p>− da Instagram al sito non si riconosce àlea; ogni volta si riprogetta tutto</p>`,
    tel: [
      tel("litigi-ora", `<div class="in"><div class="tit">${TL.tit}</div>${by("6 ottobre 2026")}<div class="p">${TL.p}</div>${emiciclo("#555", "#eb6834", "#ddd")}<div class="leg">● in lite ● resto della maggioranza ● opposizione</div></div>`),
      tel("moneta-ora", `<div class="in"><div class="tit">${TM.tit}</div>${by("10 ottobre 2026")}<div class="p">${TM.p}</div>${istogramma("#3a3631", "#c0392b")}<div class="leg">■ 20.000 sequenze vere ■ tu</div></div>`),
      "",
    ] },
  { titolo: "2 · Cornice comune", testo: `<p>Apertura uguale per tutti: blocco lime con kicker, titolo in General Sans, sommario e firma (lo stesso linguaggio dei caroselli). Sotto, ogni articolo resta libero.</p>
      <p class="pro">+ riconoscibile subito, senza perdere la personalità dei pezzi</p><p>− il passaggio tra la testata lime e il mondo dell'articolo va curato ogni volta</p>`,
    tel: [
      tel("litigi-ora", `<div class="cornice"><div class="kick">${TL.kick}</div><div class="tit">${TL.tit2}</div><div class="som">${TL.som}</div>${by("6 ottobre 2026")}</div><div class="in dopo-cornice"><div class="p">${TL.p}</div>${emiciclo("#555", "#eb6834", "#ddd")}</div>`),
      tel("moneta-ora", `<div class="cornice"><div class="kick">${TM.kick}</div><div class="tit">${TM.tit2}</div><div class="som">${TM.som}</div>${by("10 ottobre 2026")}</div><div class="in dopo-cornice"><div class="p">${TM.p}</div>${istogramma("#3a3631", "#c0392b")}</div>`),
      "",
    ] },
  { titolo: "3 · Sistema: tre fondi + lime", testo: `<p>Tutti gli articoli con gli stessi caratteri e un fondo a scelta tra nero, grigio e bianco. Il lime è l'unico colore d'accento: evidenziatore, dato chiave nei grafici, link. Foto sempre in bianco e nero.</p>
      <p class="pro">+ massima coerenza con i caroselli, si progetta più in fretta</p><p>− sul bianco il lime non si legge come testo: solo come fondo dietro il nero; i grafici con più categorie hanno bisogno di grigi</p>`,
    tel: [
      tel("sis nero", `<div class="in"><div class="kick" style="color:var(--lime)">${TL.kick}</div><div class="tit">${TL.tit2}</div>${by("6 ottobre 2026")}<div class="foto" style="background-image:url('../caroselli/foto/umberto_bossi.jpg')"></div><div class="p">${TL.p}</div>${emiciclo("#8a8a8a", "#d4ff3a", "#333")}</div>`),
      tel("sis grigio", `<div class="in"><div class="kick">${TM.kick}</div><div class="tit">${TM.tit2}</div>${by("10 ottobre 2026")}<div class="foto" style="background-image:url('../caroselli/foto/eniac-operatrici.jpg')"></div><div class="p">${TM.p}</div>${istogramma("#1a1a1a", "#d4ff3a").replace('fill="#d4ff3a"', 'fill="#d4ff3a" stroke="#000" stroke-width="2"')}</div>`),
      tel("sis bianco", `<div class="in"><div class="kick">${TS.kick}</div><div class="tit">${TS.tit2}</div>${by("bozza")}<div class="p">${TS.p}</div>${istogramma("#d9d9d9", "#000")}<div class="leg">esempio di numero futuro (n. 3)</div></div>`),
    ] },
];
document.getElementById("tutto").innerHTML = righe.map((r) => `
  <div class="riga"><div class="spiega"><h2>${r.titolo}</h2>${r.testo}</div>${r.tel.map((t) => `<div>${t}</div>`).join("")}</div>`).join("");
</script>
</body>
</html>
