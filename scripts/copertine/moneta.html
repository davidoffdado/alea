<!doctype html>
<!-- Copertina del n. 2 (moneta): il confronto dell'articolo tra una sequenza inventata e una moneta vera,
     con la serie più lunga evidenziata. Stesso stile di Desktop/moneta/moneta.html (.confronto).
     ?f=o orizzontale 1600x1000 (griglie affiancate), ?f=v verticale 1200x1500 (una sopra l'altra).
     Si rigenera con npm run copertine -->
<html lang="it">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=block" rel="stylesheet">
<style>
  :root { --fondo: #f4efe3; --testo: #1f1d19; --macchina: #3a3631; --tu: #c23a2b; --tu-testo: #b3352a; }
  html, body { margin: 0; overflow: hidden; background: var(--fondo); font-family: "Courier Prime", monospace; }
  .pagina { display: flex; align-items: center; justify-content: center; gap: 72px; }
  .o .pagina { width: 1600px; height: 1000px; }
  .v .pagina { width: 1200px; height: 1500px; flex-direction: column; gap: 56px; }
  h3 { margin: 0 0 14px; font-size: 34px; font-weight: 700; }
  .tu h3 { color: var(--tu-testo); }
  .vera h3 { color: var(--testo); }
  .griglia { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; width: 640px; }
  .v .griglia { width: 600px; }
  .cella { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 30px; }
  .tu .cella { color: var(--tu-testo); font-weight: 700; }
  .vera .cella { color: var(--macchina); }
  .tu .cella.serie { background: var(--tu); color: var(--fondo); }
  .vera .cella.serie { background: var(--macchina); color: var(--fondo); font-weight: 700; }
</style>
</head>
<body>
<div class="pagina" id="pagina"></div>
<script>
const f = new URLSearchParams(location.search).get("f") || "o";
document.body.className = f;

// generatore con seme (mulberry32): le due sequenze sono sempre le stesse
function seme(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function serieLunga(s) {
  let max = 1, cur = 1, fine = 0;
  for (let i = 1; i < s.length; i++) { cur = s[i] === s[i - 1] ? cur + 1 : 1; if (cur > max) { max = cur; fine = i; } }
  return { lung: max, da: fine - max + 1, a: fine };
}
const cambi = (s) => s.reduce((n, x, i) => n + (i && x !== s[i - 1] ? 1 : 0), 0);

// inventata: le stesse abitudini della sequenza di esempio dell'articolo (dopo una serie, la voglia di cambiare cresce);
// si tiene la prima con serie più lunga di 4 e troppi cambi
const r = seme(2026), voglia = [0, .55, .65, .85, .95, 1];
let inventata;
do {
  inventata = []; let x = r() < .5 ? 1 : 0, u = 0;
  for (let i = 0; i < 100; i++) { inventata.push(x); u++; if (r() < voglia[Math.min(u, 5)]) { x = 1 - x; u = 0; } }
} while (serieLunga(inventata).lung !== 4 || cambi(inventata) < 60);
// vera: 100 lanci veri, la prima con una serie di 7 (succede spesso: la media è circa 7)
let vera;
do { vera = Array.from({ length: 100 }, () => (r() < .5 ? 1 : 0)); } while (serieLunga(vera).lung !== 7);

const griglia = (s) => {
  const l = serieLunga(s);
  return `<div class="griglia">${s.map((x, i) => `<div class="cella${i >= l.da && i <= l.a ? " serie" : ""}">${x ? "T" : "C"}</div>`).join("")}</div>`;
};
document.getElementById("pagina").innerHTML =
  `<div class="tu"><h3>sequenza inventata</h3>${griglia(inventata)}</div>` +
  `<div class="vera"><h3>moneta vera</h3>${griglia(vera)}</div>`;
</script>
</body>
</html>
