<!doctype html>
<!-- Immagine di anteprima per i social (1200x630). Si rigenera con npm run og -->
<html lang="it">
<head>
<meta charset="utf-8">
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #000; font-family: "General Sans", sans-serif; }
  .cop { position: absolute; inset: 0 0 150px 0; background: #f3efe6; overflow: hidden; }
  .ph { position: absolute; top: 0; bottom: 0; width: 58%; background-size: cover; background-position: center 22%; filter: grayscale(1) contrast(1.1); }
  .sx { left: 0; background-image: url(../../public/img/umberto_bossi.jpg); clip-path: polygon(0 0, 100% 0, 80% 100%, 0 100%); }
  .dx { right: 0; background-image: url(../../public/img/silvio_berlusconi.jpg); clip-path: polygon(20% 0, 100% 0, 100% 100%, 0 100%); }
  .lampo { position: absolute; left: 50%; top: 50%; width: 110px; transform: translate(-50%, -50%); }
  .piede { position: absolute; left: 0; right: 0; bottom: 0; height: 150px; display: flex; align-items: center; justify-content: space-between; padding: 0 44px; color: #f2f0ea; }
  .tit { font-size: 46px; line-height: 1.05; letter-spacing: -0.03em; max-width: 840px; }
  .logo { font-weight: 700; font-size: 84px; letter-spacing: -0.075em; color: #d4ff3a; line-height: 1; }
</style>
</head>
<body>
  <div class="cop">
    <div class="ph sx"></div><div class="ph dx"></div>
    <svg class="lampo" viewBox="0 0 60 120"><polygon points="38,0 6,66 28,66 18,120 56,46 33,46 46,0" fill="#eb6834" stroke="#000" stroke-width="3" stroke-linejoin="round"/></svg>
  </div>
  <div class="piede"><div class="tit">I litigi tra gli alleati di governo</div><div class="logo">àlea</div></div>
</body>
</html>
