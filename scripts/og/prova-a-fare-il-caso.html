<!doctype html>
<!-- Immagine di anteprima per i social (1200x630): la copertina orizzontale (public/img/copertine/moneta-o.png)
     con la cornice colorata e sotto il titolo. Si rigenera con npm run copertine e poi npm run og -->
<html lang="it">
<head>
<meta charset="utf-8">
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #000; font-family: "General Sans", sans-serif; }
  .cop { position: absolute; left: 0; top: 0; width: 1200px; height: 480px; box-sizing: border-box; border: 12px solid #c23a2b; border-bottom: 0;
         background: url(../../public/img/copertine/moneta-o.png) center / cover; }
  .piede { position: absolute; left: 0; right: 0; bottom: 0; height: 150px; display: flex; align-items: center; justify-content: space-between; padding: 0 44px; color: #f2f0ea; }
  .tit { font-size: 46px; line-height: 1.05; letter-spacing: -0.03em; max-width: 840px; }
  .logo { font-weight: 700; font-size: 84px; letter-spacing: -0.075em; color: #d4ff3a; line-height: 1; }
</style>
</head>
<body>
  <div class="cop"></div>
  <div class="piede"><div class="tit">Non siamo bravi a simulare la casualità</div><div class="logo">àlea</div></div>
</body>
</html>
